site_name: Salience Network Multiscale Switch
site_description: Code and data to reproduce analyses from "The multiscale architecture of the salience network supports a brain-wide switch function"
site_author: Paul Bautin
repo_url: https://github.com/PaulBautin/salience-network-multiscale-switch
repo_name: PaulBautin/salience-network-multiscale-switch
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: default
    primary: black
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference: api.md
  - Methods: methods.md

docs_dir: docs

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
