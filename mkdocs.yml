site_name: Salience Network Multiscale Switch
site_description: Code and data to reproduce analyses from "The multiscale architecture of the salience network supports a brain-wide switch function"
site_author: Paul Bautin
site_url: https://paulbautin.github.io/salience-network-multiscale-switch/
repo_url: https://github.com/PaulBautin/salience-network-multiscale-switch
repo_name: PaulBautin/salience-network-multiscale-switch
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode (default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Avenir Next
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/library-shelves

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference:
    - Overview: api/overview.md
    - atlas_load: api/atlas_load.md
    - gradient_computation: api/gradient_computation.md
    - ieeg_processing: api/ieeg_processing.md
    - logging_utils: api/logging_utils.md
    - plot_colors: api/plot_colors.md
  - Methods:
    - Data Acquisition: methods/datasets.md
    - Analysis Methods: methods/analysis.md

docs_dir: docs

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PaulBautin
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/micalab/micapipe
    - icon: fontawesome/solid/globe
      link: https://mica-mni.github.io/
