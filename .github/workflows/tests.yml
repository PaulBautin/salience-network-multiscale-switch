name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    # The rules of .githooks/pre-commit (tools/check_privacy.py), over every tracked file:
    # no participant-level data in the repository, whatever the local hook setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No participant-level data
        run: python3 tools/check_privacy.py --tracked

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System libraries VTK needs to import
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxt6

      - name: Install the package and the test tools
        run: pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: ruff check src pipeline tests tools

      - name: Tests (synthetic data, and the privacy of source_data/)
        run: pytest -q
