name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    # The same rules as .githooks/pre-commit, over every tracked file: no participant-level
    # data in the repository, whatever the local hook setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No private data locations or raw-data files
        run: |
          if git ls-files | grep -E '^(data/dataframes|logs)/|\.(pkl|mat|npy|npz)$'; then
            echo "Private data location or file type tracked (see .githooks/pre-commit)."; exit 1
          fi

      - name: No participant IDs
        run: |
          if git grep -IlE '(^|[^A-Za-z0-9+/])(PNC|HC|PX)[0-9]{3}([^0-9]|$)'; then
            echo "Participant ID found in the files above."; exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System libraries VTK needs to import
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxt6

      - name: Install the package and the test tools
        run: pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: ruff check src pipeline tests

      - name: Tests (synthetic data, and the privacy of source_data/)
        run: pytest -q
