[project]
name = "salience-network-multiscale-switch"
version = "0.1.0"
description = "Code to reproduce analyses for 'The multiscale architecture of the salience network supports a brain-wide switch function'"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "nibabel",
    "matplotlib",
    "seaborn",
    "scipy",
    "pyyaml",
    # Moran / spin nulls, gradients and surface renders; the tested release.
    "brainspace==0.1.22",
    # brainspace 0.1.22 cannot draw colour bars with VTK >= 9.4 (plot_hemispheres;
    # tested: 9.3.1 works, 9.4.2 and 9.5.2 fail).
    "vtk>=9.3,<9.4",
    # Spectral parameterisation (Figure 3); the code uses the 2.0 API, tested with 2.0.0rc7.
    "specparam==2.0.0rc7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # mkdocstrings 1.0 calls the pre-12 highlighting API of pymdown-extensions
    "pymdown-extensions>=10,<12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salience_switch"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes only: undefined names, unused imports and variables. Style is not enforced.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
